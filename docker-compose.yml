services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/marketing
      DEMO_MODE: "true"
      LLM_PROVIDER: demo
      RESEARCH_PROVIDER: demo
      CORS_ORIGINS: http://localhost:5173
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
